name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

# Publish using the reusable workflow from dart-lang.
jobs:
  publish:
    name: Publish to pub.dev
    permissions:
      id-token: write # This is required for requesting the JWT
    runs-on: ubuntu-latest
    steps:
      - name: Checkout App Repo
        uses: actions/checkout@v4

      # Setup Dart SDK with JWT token
      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      # Install Flutter (same version the package is developed and tested with)
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.32.2'

      # Get dependencies
      - name: Install Flutter Packages
        run: flutter pub get

      # Analyze and run the tests before publishing
      - name: Analyze
        run: flutter analyze lib test

      - name: Run tests
        run: flutter test

      # Check if the pubspec version matches the git tag
      - name: Check Version
        run: dart run tools/publish/check_version.dart ${GITHUB_REF}

      # Publish to pub.dev
      - name: Publish to pub.dev
        run: dart pub publish -f
